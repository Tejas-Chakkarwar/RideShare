version: '3.8'

services:
  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: sjsu-user-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/rideshare
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    env_file:
      - ./services/user-service/.env
    volumes:
      - ./services/user-service:/app  # Hot reload for all files (app code + alembic)
      - ./shared:/app/shared          # Hot reload shared code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rideshare-network

  # Ride Service
  ride-service:
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    container_name: sjsu-ride-service
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/rideshare
      - USER_SERVICE_URL=http://user-service:8000
      - DEBUG=True
    env_file:
      - ./services/ride-service/.env
    volumes:
      - ./services/ride-service:/app
      - ./shared:/app/shared          # Hot reload shared code
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - rideshare-network

  # Booking Service
  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: sjsu-booking-service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/rideshare
      - RIDE_SERVICE_URL=http://ride-service:8000
      - USER_SERVICE_URL=http://user-service:8000
      - DEBUG=True
    env_file:
      - ./services/booking-service/.env
    volumes:
      - ./services/booking-service:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      ride-service:
        condition: service_started
      user-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - rideshare-network


  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: sjsu-notification-service
    ports:
      - "8004:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/rideshare
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    env_file:
      - ./services/notification-service/.env
    volumes:
      - ./services/notification-service:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rideshare-network

  # Tracking Service
  tracking-service:
    build:
      context: .
      dockerfile: services/tracking-service/Dockerfile
    container_name: sjsu-tracking-service
    ports:
      - "8005:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RIDE_SERVICE_URL=http://ride-service:8000
      - BOOKING_SERVICE_URL=http://booking-service:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      - SECRET_KEY=dev_secret_key_change_in_production
      - DEBUG=True
    volumes:
      - ./services/tracking-service:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ride-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - rideshare-network



  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sjsu-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rideshare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rideshare-network
  
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sjsu-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rideshare-network
  
  # pgAdmin (Optional - for database visualization)
  pgadmin:
    image: dpage/pgadmin4
    container_name: sjsu-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sjsu.edu
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - rideshare-network

networks:
  rideshare-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
